# healthy — pre-commit framework config.
# Install all three hook types with:  make install-hooks
#
# Stages, by weight:
#   commit-msg (always, instant): conventional-commit format gate.
#   pre-commit (staged files only, fast): shellcheck + zig fmt + memory-size +
#     traceability. Should complete in a couple of seconds.
#   pre-push  (full local gate, ~2–3 min): make check +
#     verify-version-bumped + verify-changelog.
#     This is the primary gate — CI mirrors it in `full-check`.
#
# Bypass in emergencies (document in PR body):
#   git commit --no-verify
#   git push   --no-verify
#   HEALTHY_SKIP_VERSION_BUMP=1 git push
#   HEALTHY_SKIP_CHANGELOG=1 git push

repos:
  # ── commit-msg stage ─────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: conventional-commit
        name: conventional-commit format
        language: system
        entry: bash scripts/check-commit-msg.sh
        stages: [commit-msg]

  # ── pre-commit stage (staged files, fast) ────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        files: \.(sh|bash)$

  - repo: local
    hooks:
      - id: zig-fmt
        name: zig fmt --check hc.zig
        language: system
        entry: zig fmt --check
        files: ^hc\.zig$
        pass_filenames: true

      - id: verify-traceability
        name: verify-traceability (story ↔ plan ↔ test ↔ CAP)
        language: system
        entry: bash scripts/verify-traceability.sh
        pass_filenames: false
        files: ^(docs/stories/|docs/plan/|docs/CAPABILITIES\.md|test/acceptance/)

      - id: memory-size
        name: memory/*.md and CLAUDE.md <= 150 lines
        language: system
        entry: bash scripts/check-memory-size.sh
        pass_filenames: false
        files: ^(memory/.*\.md|CLAUDE\.md)$

  # ── pre-push stage (primary gate, heavy) ─────────────────────────────────
  - repo: local
    hooks:
      - id: make-check
        name: make check (pre-push — full local gate)
        language: system
        entry: make check
        pass_filenames: false
        stages: [pre-push]

      - id: verify-version-bumped
        name: verify VERSION bumped since origin/main (pre-push)
        language: system
        entry: bash scripts/verify-version-bumped.sh
        pass_filenames: false
        stages: [pre-push]

      - id: verify-changelog
        name: verify CHANGELOG entry for current VERSION (pre-push)
        language: system
        entry: bash scripts/verify-changelog.sh
        pass_filenames: false
        stages: [pre-push]
