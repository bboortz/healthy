---
# Shepherd gates caller (SH-009). Acts on shepherd-agent-labelled PRs only.
# Re-fires on workflow_run so gates re-check once PR CI finishes.
# Pin @dc939b67057d97a5b2461227d0c2b19e3220b4b1 to a tagged SHA from R1 onward.
name: shepherd-gates
"on":
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_run:
    workflows: [shepherd, "*"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  gates:
    if: >-
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'shepherd-agent'))
      || github.event_name == 'workflow_run'
    uses: bboortz/shepherd/.github/workflows/reusable-shepherd-gates.yml@dc939b67057d97a5b2461227d0c2b19e3220b4b1
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || 0 }}
