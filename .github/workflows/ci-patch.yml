---
# Dev-cycle contract (SH-014) — tier 2: patch-after-merge on dev/main.
# Budget: 5 minutes wall-clock. NEVER rebuilds; re-smokes the ci-branch
# artifact keyed by commit SHA.
#
# Copy this file to .github/workflows/ci-patch.yml in your managed repo.
#
# Spec: docs/specs/dev-cycle-contract.md
name: ci-patch

"on":
  push:
    branches: [dev, main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5    # hard budget cap (SH-014).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Build-once-promote (SH-014): download the artifact produced by
      # ci-branch at ${{ github.sha }}. If the artifact is missing (eg. a
      # fresh branch with no prior PR, or a ci-release promotion that
      # bypassed ci-branch), the step soft-fails and `make ci-patch` falls
      # back to a local build via `smoke → test → build`. For image repos,
      # override `smoke` to `docker pull ghcr.io/<repo>:sha-<commit>`
      # instead.
      - name: Download release artifacts from ci-branch
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-sha-${{ github.sha }}
          path: build/release/

      # Healthy's `smoke` currently depends on `test → build`, which needs
      # Zig. Until `smoke` is decoupled from `build` (contract-correct:
      # ci-patch "never calls build"), install Zig so the fallback path
      # works when the artifact is absent. No-op cost when the artifact is
      # present — pipx install is < 5s on a cold runner.
      - name: Install Zig 0.17.1 via pipx (fallback build)
        shell: bash
        run: |
          pipx install 'ziglang==0.17.1'
          PIPX_BIN=$(pipx environment --value PIPX_BIN_DIR)
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PIPX_BIN/python-zig" "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zig" version

      - name: Run patch-tier gate
        run: make ci-patch

      - name: Upload ci-timing.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-timing-patch
          path: build/ci-timing.json
          if-no-files-found: ignore
